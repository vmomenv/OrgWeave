# Bundled LiteLLM proxy. Development and test traffic should use an EXTERNAL
# gateway via EXTERNAL_LITELLM_BASE_URL. This local proxy is only a fallback and
# requires a real provider API key; it no longer targets local inference.
model_list:
  - model_name: orgweave-default
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      description: "Default alias via external OpenAI provider"

  - model_name: orgweave-fast
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      description: "Fast alias via external OpenAI provider"

  - model_name: orgweave-strong
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      description: "Strong alias via external OpenAI provider"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  request_timeout: 300

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 300
  telemetry: false

# Bundled LiteLLM proxy (optional). Development/test traffic uses
# EXTERNAL_LITELLM_BASE_URL directly; this proxy is for local gateway usage.
model_list:
  - model_name: orgweave-default
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      description: "DeepSeek Flash default alias"

  - model_name: deepseek-flash
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: orgweave-strong
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  request_timeout: 300

litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 300
  telemetry: false

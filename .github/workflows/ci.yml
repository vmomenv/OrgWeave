name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.9"

jobs:
  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config -q

  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff==0.8.4
      - name: Ruff check
        run: ruff check apps/api packages workers scripts conftest.py
      - name: Ruff format check
        run: ruff format --check apps/api packages workers scripts conftest.py

  backend:
    name: Backend + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start infrastructure
        run: docker compose up -d --wait postgres redis temporal litellm minio

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install -e packages/shared-python -e packages/agent-sdk -e packages/skill-sdk -e apps/api
          pip install -e workers/agent-worker -e workers/temporal-worker -e workers/skill-runner -e workers/watchdog-worker
          pip install -r requirements-dev.txt

      - name: Apply migrations
        working-directory: apps/api
        run: alembic upgrade head

      - name: Run unit and integration tests
        env:
          ORGWEAVE_INTEGRATION: "1"
        run: pytest -q

      - name: Dependency diagnostics on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail=100

  frontend:
    name: Web lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @orgweave/shared-types typecheck
      - run: pnpm --filter @orgweave/web lint
      - run: pnpm --filter @orgweave/web typecheck
      - run: pnpm --filter @orgweave/web build

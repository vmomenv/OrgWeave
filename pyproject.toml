[tool.pytest.ini_options]
testpaths = [
  "apps/api/tests",
  "packages/shared-python/tests",
  "packages/agent-sdk/tests",
  "packages/skill-sdk/tests",
  "workers/agent-worker/tests",
  "workers/temporal-worker/tests",
  "workers/skill-runner/tests",
  "workers/watchdog-worker/tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires the Docker Compose infrastructure to be running",
]
filterwarnings = [
  "error::DeprecationWarning:orgweave_*",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["node_modules", ".venv", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

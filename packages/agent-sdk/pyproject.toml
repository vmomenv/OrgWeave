[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orgweave-agent-sdk"
version = "0.1.0"
description = "Agent job and tool contracts for OrgWeave"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/orgweave_agent_sdk"]

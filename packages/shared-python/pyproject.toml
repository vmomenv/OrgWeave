[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orgweave-shared"
version = "0.1.0"
description = "Shared runtime utilities for OrgWeave API and workers"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "redis>=5.2,<6",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25"]

[tool.hatch.build.targets.wheel]
packages = ["src/orgweave_shared"]

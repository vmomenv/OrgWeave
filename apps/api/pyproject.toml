[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orgweave-api"
version = "0.1.0"
description = "OrgWeave API (Phase 0 infrastructure)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "minio>=7.2,<8",
  "temporalio>=1.9,<2",
  "httpx>=0.28,<1",
  "redis>=5.2,<6",
  "pyjwt>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "python-multipart>=0.0.20,<1",
  "orgweave-shared",
  "orgweave-agent-sdk",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
